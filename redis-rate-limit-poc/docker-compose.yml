name: redis-rate-limit-poc

services:
  redis:
    image: redis:7-alpine
    container_name: ratelimit-poc-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
