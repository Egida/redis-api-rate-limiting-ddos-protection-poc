# Test-only override of rate-limit.policies: identical to the shipped application.yml except the
# windows are 10 minutes instead of 60 seconds.
#
# Why: RateLimitHttpIntegrationTest deliberately shares one quota across ordered tests. With a 60s
# window the outcome would depend on whether the suite crossed a minute boundary mid-run. Window
# length itself is verified deterministically in RateLimitWindowBoundaryTest (controllable clock)
# and RedisRateLimitStoreTest (real Redis PTTL), so stretching it here loses no coverage.
rate-limit.policies[0].id=products-read
rate-limit.policies[0].method=GET
rate-limit.policies[0].path=/api/products
rate-limit.policies[0].limit=100
rate-limit.policies[0].window=10m
rate-limit.policies[0].identity=IP

rate-limit.policies[1].id=login-attempt
rate-limit.policies[1].method=POST
rate-limit.policies[1].path=/api/login
rate-limit.policies[1].limit=10
rate-limit.policies[1].window=10m
rate-limit.policies[1].identity=IP
rate-limit.policies[1].on-redis-error=fail_closed

rate-limit.policies[2].id=order-create
rate-limit.policies[2].method=POST
rate-limit.policies[2].path=/api/orders
rate-limit.policies[2].limit=30
rate-limit.policies[2].window=10m
rate-limit.policies[2].identity=USER
